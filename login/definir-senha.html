<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Matte - Definir Senha</title>
  <link rel="stylesheet" href="login.css">
  <style>
    .box {
      width: min(560px, 100%);
    }
    .box h1 {
      margin-bottom: 0.5rem;
    }
    .box p {
      margin-bottom: 2rem;
      color: #666;
      font-size: 0.95rem;
    }
    .info-google {
      background: #e8f0fe;
      border-left: 4px solid #1a73e8;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 4px;
      color: #1a73e8;
      font-size: 0.9rem;
    }
    .info-google strong {
      display: block;
      margin-bottom: 0.3rem;
    }
    .duplo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 550px) {
      .duplo {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="marca">
      <span>La</span><b>Matte</b>
    </div>

    <div class="box">
      <h1>Complete seu cadastro</h1>
      <p>É a sua primeira vez entrando com o Google — precisamos de mais alguns dados. Da próxima vez você entra direto.</p>

      <div class="info-google">
        <strong id="nomeGoogle">Usuário Google</strong>
        <span id="emailGoogle">email@example.com</span>
      </div>

      <form id="formDefinirSenha">
        <label>
          Nome completo
          <input id="nomeCompleto" type="text" required placeholder="Seu nome e sobrenome">
        </label>
        <span id="erroNomeCompleto"></span>

        <label>
          CPF
          <input id="cpf" type="text" required maxlength="14" placeholder="000.000.000-00">
        </label>
        <span id="erroCpf"></span>

        <div class="duplo">
          <label>
            Data de nascimento
            <input id="nascimento" type="date" required>
          </label>
          <label>
            Telefone
            <input id="telefone" type="tel" required maxlength="15" placeholder="(00) 00000-0000">
          </label>
        </div>
        <span id="erroNascimento"></span>
        <span id="erroTelefone"></span>

        <label>
          CEP
          <input id="cep" type="text" required maxlength="9" placeholder="00000-000">
        </label>
        <span id="erroCep"></span>

        <label>
          Senha
          <input id="novaSenha" type="password" required placeholder="Mínimo 6 caracteres" minlength="6">
        </label>
        <span id="erroSenha1"></span>

        <label>
          Confirmar Senha
          <input id="confirmSenha" type="password" required placeholder="Repita sua senha" minlength="6">
        </label>
        <span id="erroSenha2"></span>

        <button type="submit" id="btnDefinir">Concluir cadastro</button>
        <strong id="mensagem"></strong>
      </form>
    </div>
  </main>

  <script src="definir-senha.js"></script>
</body>
</html>
