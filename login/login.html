<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Matte - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <a class="voltar" href="../principal/index.html">← Voltar à loja</a>
  <main>
    <div class="marca">
      <span>La</span><b>Matte</b>
    </div>
    
    <div class="box">
      <h1>Entrar</h1>
      <p>Acesse sua conta para continuar.</p>
      
      <form id="formLogin">
        <label>
          Usuário ou telefone
          <input id="user" autocomplete="username" placeholder="Digite seu usuário ou telefone">
        </label>
        <span id="erroUser"></span>
        
        <label>
          Senha
          <input id="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha">
        </label>
        <span id="erroSenha"></span>
        
        <button id="btnContinuar">Continuar</button>
        <strong id="mensagem"></strong>
      </form>
      
      <div class="ou">
        <span></span>OU<span></span>
      </div>
      <button id="google" class="google">
        <img src="../Imagens/google-logo.jpg" alt="Logo do Google" class="google-icon">
        Continuar com Google
      </button>
      <a class="cadastro" href="../cadastro/cadastro.html">Ainda não tenho uma conta</a>
    </div>
  </main>
  
  <script src="login.js"></script>
</body>
</html>
