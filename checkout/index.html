<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finalizar compra | La Matte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="../principal/index.html" class="marca"><span>La</span><b>Matte</b></a>
    <a href="../principal/index.html#produtos">← Continuar comprando</a>
  </header>

  <main>
    <div class="titulo">
      <span>SEU PEDIDO</span>
      <h1>Finalizar compra</h1>
      <p>Revise seus dados e produtos antes de confirmar.</p>
    </div>

    <div class="checkout">
      <section>
        <!-- CARD DE PRODUTOS -->
        <div class="card">
          <h2>Produtos</h2>
          <div id="itens"></div>
          <div class="total-linha">
            <span>Subtotal</span>
            <strong id="subtotal">R$ 0,00</strong>
          </div>
        </div>

        <!-- CARD DE DADOS CADASTRAIS -->
        <div class="card">
          <h2>Seus Dados Cadastrais</h2>
          <div id="dadosUsuario" class="dados-resumo">
            <!-- Preenchido via JS -->
          </div>
          <a href="../perfil/index.html" class="link-editar">Editar dados cadastrais →</a>
        </div>

        <!-- CARD DE ENDEREÇO DE ENTREGA -->
        <div class="card">
          <h2>Endereço de Entrega</h2>
          <form id="formEndereco" class="form-endereco">
            <div class="form-row">
              <label>
                Rua / Avenida
                <input type="text" id="endRua" placeholder="Ex: Av. Paulista" required>
              </label>
              <label>
                Número
                <input type="text" id="endNumero" placeholder="123" required>
              </label>
            </div>

            <div class="form-row">
              <label>
                Complemento (opcional)
                <input type="text" id="endComplemento" placeholder="Apt 42, Bloco B">
              </label>
              <label>
                Bairro
                <input type="text" id="endBairro" placeholder="Centro" required>
              </label>
            </div>

            <div class="form-row">
              <label>
                Cidade
                <input type="text" id="endCidade" placeholder="São Paulo" required>
              </label>
              <label>
                Estado
                <select id="endEstado" required>
                  <option value="">Selecione...</option>
                  <option value="SP">SP</option>
                  <option value="RJ">RJ</option>
                  <option value="MG">MG</option>
                  <option value="BA">BA</option>
                  <option value="PR">PR</option>
                  <option value="SC">SC</option>
                  <option value="RS">RS</option>
                  <option value="PE">PE</option>
                  <option value="CE">CE</option>
                  <option value="PA">PA</option>
                </select>
              </label>
            </div>

            <span id="msgEnderecoErro" class="msg-erro"></span>
          </form>
        </div>

        <!-- CARD DE PAGAMENTO -->
        <div class="card">
          <h2>Forma de pagamento</h2>
          <div class="pagamentos">
            <label class="pagamento ativo">
              <input type="radio" name="pagamento" value="pix" checked>
              <span>▣</span>
              <div>
                <b>PIX</b>
                <small>Pagamento instantâneo</small>
              </div>
            </label>
            <label class="pagamento">
              <input type="radio" name="pagamento" value="credito">
              <span>💳</span>
              <div>
                <b>Cartão de Crédito</b>
                <small>Parcelado em até 12x</small>
              </div>
            </label>
            <label class="pagamento">
              <input type="radio" name="pagamento" value="debito">
              <span>🏦</span>
              <div>
                <b>Débito em Conta</b>
                <small>Transferência bancária</small>
              </div>
            </label>
          </div>
        </div>
      </section>

      <!-- RESUMO LATERAL -->
      <aside class="resumo">
        <h2>Resumo do Pedido</h2>
        <div class="resumo-linha">
          <span>Produtos</span>
          <strong id="resumoSubtotal">R$ 0,00</strong>
        </div>
        <div class="resumo-linha">
          <span>Frete</span>
          <strong>Grátis</strong>
        </div>
        <hr>
        <div class="resumo-final">
          <span>Total</span>
          <strong id="resumoTotal">R$ 0,00</strong>
        </div>

        <button id="btnFinalizarCompra" class="btn-finalizar" type="button">
          Finalizar Compra
        </button>
        
        <span id="msgAlerta" class="msg-alerta"></span>
      </aside>
    </div>
  </main>

  <script src="../principal/data.js"></script>
  <script src="script.js"></script>
</body>
</html>
