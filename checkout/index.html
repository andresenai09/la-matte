<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizar compra | La Matte</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header><a href="../principal/index.html" class="marca"><span>La</span><b>Matte</b></a><a href="../principal/index.html#produtos">← Continuar comprando</a></header>
<main><div class="titulo"><span>SEU PEDIDO</span><h1>Finalizar compra</h1><p>Checkout ilustrativo para apresentação do projeto.</p></div>
<div class="checkout"><section><div class="card"><h2>Produtos</h2><div id="itens"></div><div class="total-linha"><span>Subtotal</span><strong id="subtotal"></strong></div></div>
<div class="card"><h2>Dados de entrega</h2><div class="form-grid"><label>Nome completo<input required placeholder="Seu nome"></label><label>CEP<input placeholder="00000-000"></label><label class="full">Endereço<input placeholder="Rua, número e complemento"></label><label>Cidade<input placeholder="Sua cidade"></label><label>Estado<select><option>SP</option><option>RJ</option><option>MG</option><option>PR</option></select></label></div></div>
<div class="card"><h2>Forma de pagamento</h2><div class="pagamentos"><label class="pagamento ativo"><input type="radio" name="pagamento" checked value="pix"><span>▣</span><div><b>PIX</b><small>Pagamento instantâneo</small></div></label><label class="pagamento"><input type="radio" name="pagamento" value="cartao"><span>▰</span><div><b>Cartão de crédito</b><small>Até 12x sem juros</small></div></label><label class="pagamento"><input type="radio" name="pagamento" value="boleto"><span>▤</span><div><b>Boleto bancário</b><small>Vencimento em 2 dias úteis</small></div></label></div><div id="dadosPagamento" class="dados-pagamento"></div></div></section>
<aside class="resumo"><h2>Resumo</h2><div><span>Produtos</span><strong id="resumoSubtotal"></strong></div><div><span>Frete</span><strong>Grátis</strong></div><hr><div class="final"><span>Total</span><strong id="total"></strong></div><button id="finalizar">Finalizar pedido</button><p>Esta tela é apenas demonstrativa. Nenhum pagamento real será processado.</p></aside></div></main>
<script src="../principal/data.js"></script><script src="script.js"></script></body></html>
