<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Matte - Cadastro</title><link rel="stylesheet" href="cadastro.css"></head><body><a class="voltar" href="../principal/index.html">← Voltar à loja</a><main><div class="marca"><span>La</span><b>Matte</b></div><div class="box"><h1>Criar conta</h1><p>Preencha seus dados para começar.</p><form id="formCadastro"><label>Nome de usuário<input id="campo" placeholder="Escolha seu usuário"></label><span id="erroCampo"></span><label>Nome completo<input id="nomeCompleto" placeholder="Seu nome e sobrenome"></label><span id="erroNomeCompleto"></span><label>CPF<input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></label><span id="erroCpf"></span><div class="duplo"><label>Nascimento<input id="nascimento" type="date"></label><label>Telefone<input id="telefone" inputmode="tel" maxlength="15" placeholder="(00) 00000-0000"></label></div><span id="erroNascimento"></span><span id="erroTelefone"></span><label>CEP<input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000"></label><span id="erroCep"></span><label>Senha<input id="senha" type="password" placeholder="Mínimo 6 caracteres"></label><span id="erroSenha"></span><label>Confirmar senha<input id="confirmarSenha" type="password" placeholder="Repita sua senha"></label><span id="erroConfirmarSenha"></span><label class="termos"><input id="aceitar-termos" type="checkbox"> Aceito os termos de uso</label><span id="erroTermos"></span><button id="btnContinuar">Criar conta</button><strong id="mensagemGeral"></strong></form><div class="ou"><span></span>OU<span></span></div><button id="google" class="google">Cadastrar com Google</button><a class="login" href="../login/login.html">Já tenho uma conta</a></div></main><script src="cadastro.js"></script></body></html>
